<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ST星源(000005) F10分析报告</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif; margin: 0; padding: 20px; background: #f5f5f5; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 30px; border-radius: 8px; margin-bottom: 20px; }
        .header h1 { margin: 0; font-size: 28px; }
        .stock-code { opacity: 0.8; font-size: 20px; }
        .meta { margin-top: 10px; opacity: 0.9; }
        .section { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .section h2 { margin-top: 0; color: #333; border-bottom: 2px solid #1890ff; padding-bottom: 10px; }
        .risk-section { background: #fff2f0; border: 1px solid #ffccc7; }
        .risk-list { list-style: none; padding: 0; }
        .risk-list li { padding: 10px; margin: 5px 0; border-radius: 4px; }
        .risk-极高 { background: #ff4d4f; color: white; }
        .risk-高 { background: #ff7875; color: white; }
        .risk-中 { background: #ffa39e; }
        .risk-低 { background: #ffccc7; }
        .data-table { width: 100%; border-collapse: collapse; }
        .data-table th, .data-table td { padding: 12px; text-align: left; border-bottom: 1px solid #f0f0f0; }
        .data-table th { background: #fafafa; font-weight: 600; }
        .data-table tr:hover { background: #f5f5f5; }
        .positive { color: #52c41a; }
        .negative { color: #ff4d4f; }
        .date { color: #8c8c8c; font-size: 12px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>ST星源 <span class="stock-code">(000005)</span></h1>
        <p class="meta">数据来源: 港澳资讯 V8.0 | 更新日期: 2025-09-01</p>
    </div>
    <div class="risk-section">
        <h2>⚠️ 风险提示</h2>
        <ul class="risk-list">
            <li class="risk-极高">
                <strong>退市风险</strong> <span class="date">2024-04-26</span><br>
                退市
            </li>
            <li class="risk-高风险">
                <strong>股权质押</strong><br>
                股权质押比例过高
                <p>股权质押比例为 99.87%</p>
            </li>
        </ul>
    </div>
    <div class="section">
        <h2>近五年每股收益趋势</h2>
        <div id="epsChart" style="width: 100%; height: 400px;"></div>
    </div>
    <script>
        var epsChart = echarts.init(document.getElementById('epsChart'));
        var option = {
            tooltip: { trigger: 'axis' },
            legend: { data: ['年度', '三季报', '中期', '一季报'] },
            xAxis: { type: 'category', data: ['年度'] },
            yAxis: { type: 'value', name: 'EPS（元）' },
            series: [
                { name: '年度', type: 'line', data: [null], smooth: true, itemStyle: { color: '#1890ff' } },
                { name: '三季报', type: 'line', data: [null], smooth: true, itemStyle: { color: '#faad14' } },
                { name: '中期', type: 'line', data: [null], smooth: true, itemStyle: { color: '#722ed1' } },
                { name: '一季报', type: 'line', data: [null], smooth: true, itemStyle: { color: '#13c2c2' } }
            ]
        };
        epsChart.setOption(option);
        window.addEventListener('resize', function() { epsChart.resize(); });
    </script>
</body>
</html>
